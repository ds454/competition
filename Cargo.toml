[package]
name = "competition"
version = "0.1.0"
edition = "2024"

[build-dependencies]
walkdir = "2.5.0"
tonic-prost-build = "0.14.9"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.9"
tonic-prost = "0.14"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
